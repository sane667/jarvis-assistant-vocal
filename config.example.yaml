# Configuration de Jarvis — copie ce fichier en config.yaml et mets tes valeurs.
# config.yaml n'est PAS versionne (voir .gitignore) : tes secrets restent chez toi.

mode: cloud                    # cloud = Claude + ElevenLabs ; local = Ollama + Piper ; kimi = NVIDIA Kimi + Piper/ElevenLabs

ollama:                        # mode local : modele de langage local (http://localhost:11434)
  hote: "http://localhost:11434"
  modele: "qwen3.5:4b"
  think: false

nvidia:                        # mode kimi : Kimi K2.6 via NVIDIA NIM (API OpenAI-compatible)
  cle: ""                     # recommande : variable d'environnement NVIDIA_API_KEY
  modele: "moonshotai/kimi-k2.6"
  base_url: "https://integrate.api.nvidia.com/v1"
  thinking: false              # false = latence minimale pour assistant vocal + tools

voix_locale: piper             # mode local/kimi : "piper" (recommande FR) ou "kokoro"

piper:
  modele: ""                   # chemin d'un .onnx ; vide = 1er trouve dans voix/

kokoro:
  modele: ""
  voix: ""
  voix_nom: "ff_siwis"

anthropic:
  cle: "sk-ant-..."
  modele: "claude-haiku-4-5"

elevenlabs:
  cle: ""
  voix: ""
  modele: "eleven_flash_v2_5"
  langue: "fr"

hue:
  pont: "192.168.1.XXX"
  cle: "ta-cle-hue"

mail:
  adresse: "ton.adresse@gmail.com"
  mot_de_passe_app: ""

audio:
  micro: 1
  haut_parleur: null

whisper:
  modele: "medium"

interruption:
  facteur: 1.8
  seuil: 0.025
  blocs: 5
  debug: false

assistant:
  duree_suite: 10
  piece_nuit: "chambre"
  personnalite: "jarvis_sarcastique"

obs:
  host: "localhost"
  port: 4455
  mot_de_passe: ""

apps:
  spotify: "spotify:"

utilisateur:
  nom: ""
  telephone: ""
  email: ""

reservation:
  navigateur_visible: true
  navigateur_canal: "chrome"
  profil: ".profil_reservation"
  max_etapes: 22
  sites:
    thefork: "https://www.thefork.fr/"
    doctolib: "https://www.doctolib.fr/"

twilio:
  account_sid: ""
  auth_token: ""
  numero: ""
  public_url: ""
  ngrok_authtoken: ""

appels:
  actif: true
  simulation: false
  duree_max_message: 30
  cout_par_minute: 0.11
  dossier: "logs/calls"
  port_stream: 8770
  seuil_voix: 400
  silence_fin_ms: 700
  duree_max_appel: 180

agenda:
  credentials: "google_credentials.json"
  token: "google_token.json"
  calendrier_principal: "primary"
  calendriers: []

loopstr:
  url: ""

navigateur:
  cdp_port: 9222
  domaines_proteges:
    - "impots.gouv.fr"
    - "ameli.fr"
    - "labanquepostale.fr"
    - "boursorama.com"
    - "credit-agricole.fr"
    - "paypal.com"

mcp:
  transport: "stdio"
  host: "127.0.0.1"
  port: 8765

instagram:
  version_api: "v21.0"
  dossier: "logs/instagram"
  comptes:
    - nom: "principal"
      user_id: ""
      access_token: ""
    - nom: "secondaire"
      user_id: ""
      access_token: ""

discord:
  token: ""
  user_id: ""

presence:
  actif: true
  ip: ""
  intervalle: 60
  seuil_absence: 600
  mode_absence: "off"
  mode_retour: "retour"
