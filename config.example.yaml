# Configuration de Jarvis — copie ce fichier en config.yaml et mets tes valeurs.
# config.yaml n'est PAS versionne (voir .gitignore) : tes secrets restent chez toi.

mode: cloud                    # cloud = Claude ; local = Ollama ; nvidia = NVIDIA NIM
ollama:
  hote: "http://localhost:11434"
  modele: "qwen3.5:4b"
  think: false

nvidia:
  cle: ""                     # recommande : variable d'environnement NVIDIA_API_KEY
  # Profil recommande pour Tony : rapide, bon tool calling, sans raisonnement lourd.
  # GPT-OSS 120B reste disponible pour les agents/taches complexes.
  modele: "meta/llama-3.1-8b-instruct"
  base_url: "https://integrate.api.nvidia.com/v1"
  reasoning_effort: ""        # vide = pas de parametre de raisonnement
  max_tokens: 512
  temperature: 0.2
  vision: false                # true uniquement avec un modele NVIDIA multimodal

# NVIDIA n'impose pas ElevenLabs : Piper reste local et gratuit.
voix_locale: piper
piper:
  modele: ""
kokoro:
  modele: ""
  voix: ""
  voix_nom: "ff_siwis"
anthropic:
  cle: "sk-ant-..."
  modele: "claude-haiku-4-5"
elevenlabs:
  cle: ""
  voix: ""
  modele: "eleven_flash_v2_5"
  langue: "fr"
hue:
  pont: "192.168.1.XXX"
  cle: "ta-cle-hue"
mail:
  adresse: "ton.adresse@gmail.com"
  mot_de_passe_app: ""
audio:
  micro: 1
  haut_parleur: null
whisper:
  modele: "medium"
interruption:
